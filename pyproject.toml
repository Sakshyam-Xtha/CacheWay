[project]
name="cacheway"
version="0.1"
requires-python = ">=3.10"
description = "A caching proxy tool."
dependencies = [
    "typer>=0.16",
]
readme = "README.md"

[build-system]
requires=["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.scripts]
cacheway = "cacheway.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]