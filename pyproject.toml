[project]
name="cacheway"
version="0.1"
requires-python = ">=3.10"
description = "A caching proxy tool."
dependencies = [
    "typer>=0.16",
    "fastapi>=0.115",
    "httpx>=0.27",
    "python-dotenv>=1.0.0",
    "uvicorn>=0.52",
]
readme = "README.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires=["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.scripts]
cacheway = "cacheway.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]